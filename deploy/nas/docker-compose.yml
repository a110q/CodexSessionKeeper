services:
  codex-update-server:
    image: nginx:alpine
    container_name: codex-update-server
    restart: unless-stopped
    ports:
      - "18080:80"
    volumes:
      - ./codex-updates:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
