user _www;
worker_processes auto;
error_log /var/log/codex-update-nginx-error.log warn;
pid /var/run/codex-update-nginx.pid;

events {
    worker_connections 256;
}

http {
    default_type application/octet-stream;
    types {
        text/html html;
        application/json json;
        application/xml xml;
        application/octet-stream sig yml zip exe;
    }
    access_log /var/log/codex-update-nginx-access.log;
    sendfile on;
    etag on;
    server_tokens off;

    server {
        listen 192.168.10.54:18080;
        server_name _;
        root /Users/Shared/codex-update-site;
        index index.html;
        autoindex off;
        client_max_body_size 1k;

        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        location ~ /\. {
            return 404;
        }

        location ~* \.(json|sig|xml|yml)$ {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        location ~* \.(zip|exe)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        location / {
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri $uri/ =404;
        }
    }
}
